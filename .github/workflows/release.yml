name: Zulip message on stable version release

on:
  release:
    types: [published]

jobs:
  zulip_message:
    name: Post release information
    uses: ./.github/workflows/zulip.yml
    with:
      TOPIC: "Release"
      MESSAGE: ":tada: New version release :tada:\nRelease: ${{ github.event.release.name}}\nTag: ${{ github.event.release.tag_name }}\nLink: ${{ github.event.release.html_url }}"
    secrets:
      API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
