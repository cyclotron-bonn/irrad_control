name: Run tests

on:
  workflow_call:
    inputs:
      PY_VERSION:
        default: "3.11"
        required: false
        type: string

jobs:
  pytest:
    name: Testing Python ${{matrix.python-version}} on ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["${{ inputs.PY_VERSION }}"]
    runs-on: ${{matrix.os}}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{matrix.python-version}}
      - name: Package installation
        id: install
        run: |
          pip install --upgrade pip
          pip install -e .[main]
      - name: Qt5 default installation  # Needed for running headless
        run: |
          sudo apt-get update
          sudo apt-get install qttools5-dev-tools --fix-missing
      - name: Headless display setup
        uses: pyvista/setup-headless-display-action@v4
      - name: Testing on ref -> ${{github.head_ref || github.ref_name}}
        id: tests
        run: pytest
